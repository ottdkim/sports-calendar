<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daehyeon's Sports Calendar</title>
  <link rel="icon" href="data:,">
  <script>
    // Apply the saved light/dark choice before the page paints (avoids a flash).
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="site-header">
      <h1>Daehyeon's Sports Calendar</h1>
      <div class="header-actions">
        <div class="chips" role="group" aria-label="Filter by league">
          <button class="chip is-active" data-filter="ALL" aria-pressed="true">All</button>
          <button class="chip" data-filter="F1" aria-pressed="false">F1</button>
          <button class="chip" data-filter="NHL" aria-pressed="false">NHL</button>
        </div>
        <button id="theme-toggle" class="icon-btn theme-toggle" aria-label="Switch theme"></button>
      </div>
    </header>

    <section class="week" aria-label="This week">
      <div class="section-bar">
        <span id="week-label" class="muted"></span>
        <div class="nav-buttons">
          <button id="week-prev" class="icon-btn" aria-label="Previous week">‹</button>
          <button id="week-today" class="text-btn">Today</button>
          <button id="week-next" class="icon-btn" aria-label="Next week">›</button>
        </div>
      </div>
      <div id="week-strip" class="week-strip"></div>
    </section>

    <section class="events" aria-live="polite">
      <h2 id="events-title"></h2>
      <ul id="events-list" class="event-list"></ul>
    </section>

    <section class="month" aria-label="Monthly calendar">
      <div class="section-bar">
        <h2 id="month-label"></h2>
        <div class="nav-buttons">
          <button id="month-prev" class="icon-btn" aria-label="Previous month">‹</button>
          <button id="month-next" class="icon-btn" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="month-grid month-head" aria-hidden="true">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div id="month-grid" class="month-grid"></div>
    </section>

    <section class="standings">
      <h2>Standings</h2>
      <div class="standings-grid">
        <article class="card" id="f1-standings">
          <div class="card-head">
            <div>
              <h3><span class="tag tag-f1">F1</span> Championship</h3>
              <p id="f1-standings-label" class="muted small"></p>
            </div>
            <div class="segmented" role="group" aria-label="F1 standings type">
              <button data-f1view="drivers" class="is-active" aria-pressed="true">Drivers</button>
              <button data-f1view="constructors" aria-pressed="false">Constructors</button>
            </div>
          </div>
          <table class="table" id="f1-table"></table>
          <div class="pager" id="f1-pager">
            <button id="f1-prev" class="icon-btn" aria-label="Previous page">‹</button>
            <span id="f1-page-label" class="muted small"></span>
            <button id="f1-next" class="icon-btn" aria-label="Next page">›</button>
          </div>
        </article>

        <article class="card" id="nhl-standings">
          <div class="card-head">
            <div>
              <h3><span class="tag tag-nhl">NHL</span> <span id="nhl-division"></span></h3>
              <p id="nhl-standings-label" class="muted small"></p>
            </div>
            <div class="segmented" id="nhl-divisions" role="group" aria-label="NHL division">
              <button data-division="Atlantic" aria-pressed="false" aria-label="Atlantic"><span class="label-long">Atlantic</span><span class="label-short">ATL</span></button>
              <button data-division="Metropolitan" aria-pressed="false" aria-label="Metropolitan"><span class="label-long">Metro</span><span class="label-short">MET</span></button>
              <button data-division="Central" aria-pressed="false" aria-label="Central"><span class="label-long">Central</span><span class="label-short">CEN</span></button>
              <button data-division="Pacific" aria-pressed="false" aria-label="Pacific"><span class="label-long">Pacific</span><span class="label-short">PAC</span></button>
            </div>
          </div>
          <table class="table" id="nhl-table"></table>
        </article>
      </div>
    </section>

    <footer class="site-footer muted small">
      <p id="updated"></p>
      <p>Times are shown in Ottawa time (24-hour). Local start times appear under each event; on desktop, hover a time for details.</p>
    </footer>
  </main>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
